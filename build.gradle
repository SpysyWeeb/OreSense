plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-fabric-${minecraft_version}"

loom {
    accessWidenerPath = file("src/main/resources/oresense.accesswidener")
    mixin {
        defaultRefmapName = 'oresense.refmap.json'
    }
}

repositories {
    mavenCentral()
    // Mod Menu, for its optional config-button API (compile only; never shipped or required)
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Optional at runtime: only Mod Menu queries the "modmenu" entrypoint, so without it the
    // class that implements its API is never loaded (fabric.mod.json lists Mod Menu under suggests).
    modCompileOnly "com.terraformersmc:modmenu:14.0.2"

    // Unit tests cover pure classes only (no Minecraft classes), so they port verbatim.
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

test {
    useJUnitPlatform()
}

// Minecraft 1.21.5 uses Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', mod_id
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand version: project.version, mod_id: mod_id
    }
}

jar {
    from('LICENSE') { rename { "${it}_${mod_id}" } }
}

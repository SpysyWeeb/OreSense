plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-quilt-${minecraft_version}"

loom {
    mixin {
        defaultRefmapName = 'oresense.refmap.json'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

// Build with Java 17 while keeping the mod compatible with Minecraft 1.17.1's Java 16.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 16
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', mod_id
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand version: project.version, mod_id: mod_id
    }
}

jar {
    from('LICENSE') { rename { "${it}_${mod_id}" } }
}

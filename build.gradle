plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-fabric-${minecraft_version}"

loom {
    accessWidenerPath = file("src/main/resources/oresense.accesswidener")
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

// Minecraft 26.3 uses Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// Fabric supplies pack metadata per resource type; their format numbers differ.
processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', mod_id
    filesMatching('fabric.mod.json') {
        expand version: project.version, mod_id: mod_id
    }
}

jar {
    from('LICENSE') { rename { "${it}_${mod_id}" } }
}

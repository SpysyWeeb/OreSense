plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = true
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        register('client')
        register('server') { args '--nogui' }
        register('gameTestServer')
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.named('processResources', ProcessResources).configure {
    def values = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                  forge_version: forge_version, forge_version_range: forge_version_range,
                  loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
                  mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
                  mod_description: mod_description]
    inputs.properties values
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand values }
}

tasks.named('jar', Jar).configure {
    manifest { attributes 'Implementation-Title': mod_name, 'Implementation-Version': mod_version }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

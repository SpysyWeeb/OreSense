plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.116'
}
version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-neoforge-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
runs {
    configureEach { modSource project.sourceSets.main }
    client {}
    server { programArgument '--nogui' }
}
dependencies { implementation "net.neoforged:neoforge:${neo_version}" }
sourceSets.main.resources.srcDir 'src/generated/resources'
tasks.named('processResources', ProcessResources).configure {
    var properties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, neo_version_range: neo_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties properties
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand properties }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
publishing { publications { register('mavenJava', MavenPublication) { from components.java } } }
